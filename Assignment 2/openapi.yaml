openapi: 3.1.0
info:
  title: GitHub Issues Gateway
  version: 1.0.0
paths:
  /issues/{number}:
    get:
      summary: Get Issue Endpoint
      description: Return a single issue by issue number.
      operationId: get_issue_endpoint_issues__number__get
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '404':
          description: Issue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: github_api_error
                message: Not Found
                status_code: 404
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - GitHubBearer: []
    patch:
      summary: Update Issue Endpoint
      description: Update an existing issue.
      operationId: update_issue_endpoint_issues__number__patch
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '400':
          description: Invalid issue update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - GitHubBearer: []
  /issues:
    get:
      summary: List Issues Endpoint
      description: Return issues from the configured GitHub repository.
      operationId: list_issues_endpoint_issues_get
      parameters:
      - name: state
        in: query
        required: false
        schema:
          enum:
          - open
          - closed
          - all
          type: string
          default: open
          title: State
      - name: labels
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Labels
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Per Page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueResponse'
                title: Response List Issues Endpoint Issues Get
          headers:
            Link:
              description: GitHub pagination links such as next, previous, first,
                and last.
              schema:
                type: string
            X-Request-ID:
              description: Request tracing identifier.
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - GitHubBearer: []
    post:
      summary: Create Issue Endpoint
      description: Create a new issue in the configured GitHub repository.
      operationId: create_issue_endpoint_issues_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
              example:
                number: 4
                html_url: https://github.com/example/repository/issues/4
                state: open
                title: Example issue
                body: Example issue body.
                labels:
                - bug
                created_at: '2026-09-05T20:00:00Z'
                updated_at: '2026-09-05T20:00:00Z'
        '400':
          description: Invalid issue payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: validation_error
                message: Invalid request.
                status_code: 400
        '401':
          description: GitHub authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: github_api_error
                message: Bad credentials
                status_code: 401
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - GitHubBearer: []
  /issues/{number}/comments:
    post:
      summary: Create Comment Endpoint
      description: Create a comment on an existing issue.
      operationId: create_comment_endpoint_issues__number__comments_post
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - GitHubBearer: []
    get:
      summary: List Comments Endpoint
      description: Return comments for an existing issue.
      operationId: list_comments_endpoint_issues__number__comments_get
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
                title: Response List Comments Endpoint Issues  Number  Comments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - GitHubBearer: []
  /webhook:
    post:
      summary: Github Webhook
      description: Receives GitHub issues, issue_comment, and ping events. The X-Hub-Signature-256
        header is verified using HMAC SHA-256 and WEBHOOK_SECRET. Successful deliveries
        return HTTP 204.
      operationId: github_webhook_webhook_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: Invalid webhook signature
          content:
            application/json:
              example:
                error: invalid_signature
                message: Webhook signature validation failed.
                status_code: 401
        '400':
          description: Unsupported event, action, or invalid payload
          content:
            application/json:
              example:
                error: unsupported_event
                message: Unsupported GitHub webhook event.
                status_code: 400
  /events:
    get:
      summary: Get Events
      description: Return recently processed webhook events.
      operationId: get_events_events_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookEventResponse'
                title: Response Get Events Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /healthz:
    get:
      summary: Health Check
      description: Return the health status of the service.
      operationId: health_check_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    CommentCreate:
      properties:
        body:
          type: string
          minLength: 1
          title: Body
      type: object
      required:
      - body
      title: CommentCreate
      description: Request model for creating an issue comment.
    CommentResponse:
      properties:
        id:
          type: integer
          title: Id
        body:
          type: string
          title: Body
        user:
          type: string
          title: User
        created_at:
          type: string
          format: date-time
          title: Created At
        html_url:
          type: string
          title: Html Url
      type: object
      required:
      - id
      - body
      - user
      - created_at
      - html_url
      title: CommentResponse
      description: Response model for an issue comment.
    ErrorResponse:
      properties:
        error:
          type: string
          title: Error
        message:
          type: string
          title: Message
        status_code:
          type: integer
          title: Status Code
      type: object
      required:
      - error
      - message
      - status_code
      title: ErrorResponse
      description: Standard error response returned by the API.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IssueCreate:
      properties:
        title:
          type: string
          minLength: 1
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        labels:
          items:
            type: string
          type: array
          title: Labels
      type: object
      required:
      - title
      title: IssueCreate
      description: Request model for creating a GitHub issue.
    IssueResponse:
      properties:
        number:
          type: integer
          title: Number
        html_url:
          type: string
          title: Html Url
        state:
          type: string
          enum:
          - open
          - closed
          title: State
        title:
          type: string
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        labels:
          items:
            type: string
          type: array
          title: Labels
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - number
      - html_url
      - state
      - title
      - body
      - labels
      - created_at
      - updated_at
      title: IssueResponse
      description: Response model returned by the Issues Gateway.
    IssueUpdate:
      properties:
        title:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        state:
          anyOf:
          - type: string
            enum:
            - open
            - closed
          - type: 'null'
          title: State
      type: object
      title: IssueUpdate
      description: Request model for updating a GitHub issue.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WebhookEventResponse:
      properties:
        id:
          type: integer
          title: Id
        event:
          type: string
          title: Event
        action:
          type: string
          title: Action
        issue_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Issue Number
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - id
      - event
      - action
      - issue_number
      - timestamp
      title: WebhookEventResponse
      description: Response model for a processed webhook event.
  securitySchemes:
    GitHubBearer:
      type: http
      scheme: bearer
      description: Represents the server-side GitHub credential configured through
        GITHUB_TOKEN. The gateway uses this credential when calling GitHub.
